<style>
/* Dippy art direction: dye-house poster. Cream paper, flat saturated dyes, thick ink outlines, hard offset shadows, Archivo Black. Light theme. */
:root{
  --bg:#f4efe3; --paper:#fffaf0; --ink:#1d1b33; --muted:#6b6a80; --accent:#ff5d73; --ch:#ff5d73; --line:rgba(29,27,51,.9);
  --k-card:#fffaf0; --k-ink:#1d1b33; --k-muted:#6b6a80; --k-btn:rgba(29,27,51,.08); --k-on-accent:#1d1b33; --k-line:rgba(29,27,51,.9); --k-font:'DM Sans',system-ui,sans-serif; --k-scrim:rgba(29,27,51,.6);
  --disp:'Archivo Black','DM Sans',system-ui,sans-serif; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --lh:30px; --sh:3px 3px 0 var(--ink); color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:600;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--bg) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;flex-direction:column;gap:12px;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));position:relative}
.scr.on{display:flex;animation:scrIn .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block}
h2,.logo,.d{font-family:var(--disp);font-weight:400}
/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:10px;overflow:hidden}
#intro.on{animation:none}
.blk{position:absolute;pointer-events:none;border:3px solid var(--ink)}
.blk.a{width:220px;height:220px;border-radius:50%;background:#ff5d73;left:-70px;top:-50px;animation:blk 7s ease-in-out infinite alternate}
.blk.b{width:150px;height:150px;background:#ffd166;right:-40px;top:130px;transform:rotate(18deg);animation:blk 6s -2s ease-in-out infinite alternate}
.blk.c{width:260px;height:130px;border-radius:130px 130px 0 0;background:#3a67e8;left:20px;bottom:-12px;animation:blk 8s -1s ease-in-out infinite alternate}
.blk.d{width:90px;height:90px;border-radius:50%;background:#06d6a0;right:30px;bottom:90px;animation:blk 5s -3s ease-in-out infinite alternate}
@keyframes blk{to{transform:translate(10px,-14px) rotate(8deg)}}
.logo{position:relative;font-size:clamp(72px,24vw,112px);line-height:1;letter-spacing:-.03em;color:var(--paper);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);animation:logoIn .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes logoIn{from{opacity:0;transform:translateY(30px) scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
.tag{position:relative;font-size:17px;font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;box-shadow:var(--sh);opacity:0;animation:fadeUp .7s .7s ease-out forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.06)}}
.cta{position:relative;font-family:var(--disp);background:var(--ch);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:14px 34px;font-size:20px;box-shadow:var(--sh);min-height:54px}
.cta:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#tapStart{margin-top:26px;background:#ffd166;opacity:0;animation:fadeUp .6s 1.4s ease-out forwards,pulse 1.8s 2.1s ease-in-out infinite}
/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 10px 4px 5px;min-height:44px;font-family:var(--disp);font-size:15px;box-shadow:var(--sh);font-variant-numeric:tabular-nums}
.chip.rank{flex:1;min-width:0}
.lv{width:30px;height:30px;border-radius:50%;background:var(--ch);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:13px;flex:none}
.xp{flex:1;height:10px;border-radius:6px;background:#e5dfcd;border:2px solid var(--ink);overflow:hidden;min-width:30px}
.xp i{display:block;height:100%;background:var(--ch);transition:width .5s}
.chip.coin svg{width:22px;height:22px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--paper);border:3px solid var(--ink);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translate(3px,3px);box-shadow:none}
.dot{position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:#ef476f;border:3px solid var(--ink)}
/* ---------- home ---------- */
#scene{border-radius:18px;overflow:hidden;border:3px solid var(--ink);box-shadow:var(--sh);position:relative}
#scene svg{width:100%;height:auto}
#sceneTitle{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
#sceneTitle small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:99px}
#sceneTitle b{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1;background:var(--paper);border:3px solid var(--ink);padding:5px 10px;border-radius:10px;box-shadow:var(--sh)}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;border-radius:14px;padding:8px 2px;background:var(--paper);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--disp);font-size:16px;box-shadow:var(--sh)}
.tab small{font-family:var(--font);font-size:10px;font-weight:700;color:var(--muted)}
.tab.sel{background:var(--ch)}.tab.sel small{color:var(--ink)}
.tab.lock{opacity:.5}.tab svg{width:14px;height:14px}
#nights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nb{aspect-ratio:1.15;border-radius:14px;background:var(--paper);border:3px solid var(--ink);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:22px;position:relative;line-height:1}
.nb small{font-family:var(--font);font-size:11px;font-weight:800;margin-top:2px;min-height:12px;letter-spacing:.04em}
.nb.done{background:var(--ch)}
.nb.next{background:#ffd166;animation:hop 1.2s ease-in-out infinite}
.nb.boss::after{content:'★';position:absolute;top:-10px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#ffd166;font-size:12px;display:flex;align-items:center;justify-content:center}
.nb:disabled{background:#e0dac7;color:var(--muted);box-shadow:none}
.nb:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.nb svg{width:18px;height:18px;color:var(--muted)}
@keyframes hop{50%{transform:translateY(-5px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:12px;text-align:left;border:3px solid var(--ink);box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px;min-height:88px;position:relative}
.mode b{font-family:var(--disp);font-weight:400;font-size:17px}.mode span{font-size:12px;font-weight:600;line-height:1.3}
.mode.daily{background:#ff9f1c}.mode.endless{background:#4cc9f0}
.mode:disabled{filter:grayscale(1) opacity(.55);box-shadow:none}
.mode:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.mode .badge{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
#cont{width:100%;border-radius:16px;padding:12px 18px;text-align:left;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#cont small{display:block;font-family:var(--font);font-weight:700;font-size:12px}
.sub{color:var(--muted);font-size:13px;text-align:center;font-weight:700}
.linkbtn{align-self:center;color:var(--ink);font-weight:800;font-size:13px;padding:8px 16px;border-radius:99px;background:var(--paper);border:3px solid var(--ink)}
/* ---------- game ---------- */
#game{gap:10px}
.gtop{display:flex;align-items:center;gap:8px}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{font-size:12px;color:var(--muted);font-weight:700}
#goals{display:flex;gap:10px;align-items:center}
.gbox{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh);padding:6px 12px;display:flex;flex-direction:column;gap:4px}
.gbox .t{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.gbox .t span{overflow:hidden;text-overflow:ellipsis;font-size:11px}.gbox .t b{font-family:var(--disp);font-weight:400;font-size:16px;letter-spacing:0;text-transform:none}
.gbar{height:10px;border-radius:6px;border:2px solid var(--ink);background:#e5dfcd;overflow:hidden}.gbar i{display:block;height:100%;background:var(--ch);transition:width .35s}
.gbox.low .t b{color:#d62839;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.45}}
#stage{position:relative;flex:1;min-height:250px;display:flex;align-items:center;justify-content:center}
#vats{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:26px 14px;padding:14px 4px 10px;max-width:100%}
.vat{position:relative;width:var(--vw,54px);height:calc(var(--cap) * var(--lh) + 14px);transition:transform .3s cubic-bezier(.3,1.35,.5,1);transform-origin:50% 0;cursor:pointer;filter:drop-shadow(3px 4px 0 rgba(29,27,51,.22))}
.vat::before{content:'';position:absolute;left:-10px;right:-10px;bottom:-9px;height:8px;border-radius:4px;background:#d8d0b8;border:2px solid var(--ink);z-index:-1}
.vat.sel{transform:translateY(-16px)}
.vat.hint{animation:vhint .7s ease-in-out 2}
@keyframes vhint{50%{transform:translateY(-12px) rotate(-2deg)}}
.rim{position:absolute;top:0;left:-5px;right:-5px;height:11px;border:3px solid var(--ink);border-radius:7px;background:var(--paper);z-index:3}
.jar{position:absolute;top:8px;right:0;bottom:0;left:0;border:3px solid var(--ink);border-top:none;border-radius:0 0 22px 22px;background:rgba(255,255,255,.7);overflow:hidden;display:flex;flex-direction:column-reverse}
.ly{height:var(--lh);flex:none;display:flex;align-items:center;justify-content:center;border-top:3px solid var(--ink);color:rgba(255,255,255,.75);font-size:11px;line-height:1;transform-origin:50% 100%;transition:height .35s}
.ly:first-child{border-top:none}
.ly.dk{color:rgba(29,27,51,.55)}
.ly.new{animation:grow .4s cubic-bezier(.3,1.2,.5,1)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ly.drain{height:0;border-top-width:0}
.ly.q{background:#cfcadb!important;color:#7a7890;font-family:var(--disp);font-size:15px}
.vat.done .jar{box-shadow:inset 0 0 0 3px #fff}
.vat.done::after{content:'★';position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#ffd166;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;animation:starIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes starIn{from{transform:translateX(-50%) scale(0) rotate(-90deg)}}
.cork{position:absolute;top:-6px;left:-4px;right:-4px;height:24px;background:#c9965a;border:3px solid var(--ink);border-radius:8px;z-index:4;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cork svg{width:14px;height:14px}
.cork.pop{animation:corkpop .6s cubic-bezier(.3,0,.8,.6) forwards}
@keyframes corkpop{to{transform:translateY(-70px) rotate(40deg);opacity:0}}
.vat.lock .jar{opacity:.75}
.vat.bad{animation:bad .3s}
@keyframes bad{25%{margin-left:-5px;margin-right:5px}75%{margin-left:5px;margin-right:-5px}}
#fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:10;overflow:visible}
.stream{position:absolute;width:8px;border-radius:4px;border:2px solid var(--ink);transform-origin:50% 0;animation:strm .32s ease-out forwards}
@keyframes strm{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ring{position:absolute;border-radius:50%;border:3px solid var(--ink);animation:ringo .55s ease-out forwards}
@keyframes ringo{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.conf{position:absolute;width:9px;height:9px;border:2px solid var(--ink);animation:confo .9s ease-out forwards}
@keyframes confo{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.float{position:absolute;font-family:var(--disp);font-size:22px;color:var(--ink);text-shadow:2px 2px 0 var(--paper);animation:flo .9s ease-out forwards;white-space:nowrap}
@keyframes flo{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-50px) scale(1.15);opacity:0}}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:2.6em;font-weight:700;line-height:1.35;padding:0 6px}
.boosters{display:flex;gap:8px}
.bst{flex:1;border-radius:14px;background:var(--paper);border:3px solid var(--ink);box-shadow:var(--sh);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;min-height:62px;justify-content:center}
.bst svg{width:22px;height:22px}
.bst em{font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px}
.bst em svg{width:12px;height:12px}
.bst:disabled{opacity:.4;box-shadow:none}.bst:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
/* ---------- result ---------- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(29,27,51,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:22px 18px 18px;max-width:350px;width:100%;display:flex;flex-direction:column;gap:11px;text-align:center;box-shadow:6px 6px 0 var(--ink);animation:cardIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{transform:scale(.8) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:28px;line-height:1.05}
.card p{font-size:14px;color:var(--muted);line-height:1.4;font-weight:600}
.rstars{display:flex;justify-content:center;gap:8px;min-height:60px}
.rstars svg{width:56px;height:56px;color:#e5dfcd;transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.8,.4,1),color .2s}
.rstars svg.on{color:#ffd166;transform:scale(1) rotate(-6deg)}
.rstars svg path{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.rwd{display:flex;justify-content:center;gap:8px}
.rwd span{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:4px 12px;font-family:var(--disp);font-size:15px}
.rwd svg{width:20px;height:20px}
.btn{border-radius:14px;padding:12px;font-family:var(--disp);font-size:16px;background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;line-height:1.15}
.btn small{font-family:var(--font);font-weight:700;font-size:11.5px;display:flex;align-items:center;gap:5px}
.btn small svg{width:14px;height:14px}
.btn.main{background:var(--ch)}.btn.vid{background:#4cc9f0}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.row{display:flex;gap:8px}.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-height:700px){:root{--lh:25px}#vats{gap:20px 12px}}
.applogo{position:relative;width:min(34vw,148px);height:min(34vw,148px);border-radius:26%;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12);animation:logoPop 1s cubic-bezier(.2,1.5,.4,1) both,logoFloat 4s 1s ease-in-out infinite alternate;margin-bottom:10px;z-index:2}@keyframes logoPop{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}@keyframes logoFloat{to{transform:translateY(-7px)}}

/*PERF*/
/* performance: composited-only animation (transform/opacity), no full-screen blends/blur; low-end devices get a lighter mode */
#game::before{top:-14%!important;right:-14%!important;bottom:-14%!important;left:-14%!important;background-position:0 0!important;will-change:transform;animation:bgflow 22s ease-in-out infinite alternate!important}
@keyframes bgflow{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2.5%,0) scale(1.1)}}
body::before{mix-blend-mode:normal!important;opacity:.05!important}
#caus{mix-blend-mode:normal!important;opacity:.5;will-change:transform}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
html.lowfx .tile,html.lowfx .vat{transition-duration:.12s!important}

/*END-PERF*/
/*LAYOUT*/
/* Layout for average Android phones: game screen fills the viewport, vats scale to the free height (see fitVats) */
#game.scr.on{height:100vh;height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:6px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom));padding-left:10px;padding-right:10px}
:root{--bgfx:radial-gradient(circle at 15% 12%,rgba(255,93,115,.20),transparent 45%),radial-gradient(circle at 88% 85%,rgba(76,201,240,.22),transparent 50%),radial-gradient(circle at 80% 10%,rgba(255,209,102,.30),transparent 40%)}
#game::before{content:'';position:absolute;top:-14%;right:-14%;bottom:-14%;left:-14%;pointer-events:none;z-index:0;background:var(--bgfx);will-change:transform}
#game>*{position:relative;z-index:1}
#game .hint{min-height:0;font-size:12.5px;line-height:1.3;margin:0}#game .hint:empty{display:none}
#game .boosters{gap:6px}#game .bst{min-height:52px;padding:4px 2px;font-size:11px}
#game .ib{width:40px;height:40px}
#stage{flex:1 1 0;min-height:0;overflow:visible}
#vats{gap:calc(var(--lh) * .9) 14px;padding:calc(var(--lh) * .7) 4px 0;align-content:center}
.vat{width:var(--vw,54px)}
.vat::before{height:8px}
@media (max-height:620px){#game .hint{display:none}#game .bst{min-height:46px}#game .bst em{display:none}}

/*END-LAYOUT*/

/*COMPAT*/
/* small / narrow phones (320-360px) and long translations: nothing may overflow or clip */
.row{flex-wrap:wrap}
.row .btn{min-width:0;flex:1 1 84px;padding-left:6px;padding-right:6px;font-size:15px}
#game .bst{min-width:0;overflow:hidden}
#game .bst span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt b{line-height:1.2;padding-top:1px}
@media (max-width:370px){#game .bst span{font-size:10px;letter-spacing:0!important}#game .bst{font-size:10px}.row .btn{font-size:14px}.card{padding-left:14px;padding-right:14px}}
.k-card{max-width:calc(100vw - 24px)}
#game #bGameSet span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#game #bGameSet svg{width:24px;height:24px}

/*END-COMPAT*/
</style>

<script>/* Dippy engine: layered dye vats. Pour the top run of one vat onto another vat with the same top colour (or an empty one).
