<style>
/* Mandalo art direction: a night temple garden. Deep indigo sky, gold line-art, lilac paper cards, serif (Gelasio) titles, petals in a soft jewel palette. Calm, symmetric, precise. */
:root{
  --bg:#1a1250; --paper:#f3ecff; --ink:#1a1250; --muted:#b9acf0; --accent:#ffcf5a; --ch:#ffcf5a; --pink:#ff7ab8; --teal:#5fe0d0; --gold:#ffcf5a;
  --k-card:#f3ecff; --k-ink:#1a1250; --k-muted:#6a5aa8; --k-btn:rgba(26,18,80,.10); --k-on-accent:#1a1250; --k-line:rgba(26,18,80,.95); --k-font:'DM Sans',system-ui,sans-serif; --k-scrim:rgba(10,6,40,.74);
  --disp:'Gelasio',Georgia,'Times New Roman',serif; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--paper);font-family:var(--font);font-weight:700;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#4a3aa8 0%,#2b2085 38%,#1a1250 70%,#0d0a2e 100%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;flex-direction:column;gap:12px;min-height:100vh;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));position:relative}
.scr.on{display:flex;animation:scrIn .3s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block}
h2,.logo,.d{font-family:var(--disp);font-weight:700;letter-spacing:.01em}
/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:10px;overflow:hidden}
#intro.on{animation:none}
#halo{position:absolute;left:50%;top:50%;width:min(130vw,560px);height:min(130vw,560px);margin:calc(min(130vw,560px)/-2) 0 0 calc(min(130vw,560px)/-2);opacity:.5;animation:spin 90s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#e8e0ff;animation:tw 3.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.logo{position:relative;font-size:clamp(54px,18vw,92px);line-height:1;color:var(--paper);text-shadow:0 0 28px rgba(190,170,255,.55),0 3px 0 #0d0a2e;animation:logoIn 1s ease-out both;letter-spacing:.02em}
@keyframes logoIn{from{opacity:0;transform:translateY(18px) scale(.96);letter-spacing:.2em}to{opacity:1;transform:none;letter-spacing:.02em}}
.tag{position:relative;font-size:16px;color:var(--muted);max-width:300px;line-height:1.3;opacity:0;animation:fadeUp .7s .6s ease-out forwards;font-family:var(--disp);font-weight:400;font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.05)}}
.cta{position:relative;font-family:var(--disp);font-weight:700;background:linear-gradient(#ffe08a,#ffc23a);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 28px;font-size:22px;box-shadow:0 5px 0 #0d0a2e,inset 0 2px 0 rgba(255,255,255,.6);transition:transform .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #0d0a2e}
#tapStart{margin-top:22px;opacity:0;animation:fadeUp .6s 1.3s ease-out forwards,pulse 2s 2.2s ease-in-out infinite}
.applogo{position:relative;width:min(34vw,148px);height:min(34vw,148px);border-radius:26%;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.12);animation:logoPop 1s cubic-bezier(.2,1.4,.4,1) both,logoFloat 4.5s 1s ease-in-out infinite alternate;margin-bottom:10px;z-index:2}@keyframes logoPop{from{opacity:0;transform:scale(.6) rotate(-10deg)}to{opacity:1;transform:none}}@keyframes logoFloat{to{transform:translateY(-6px)}}
/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 12px 4px 5px;font-size:16px;box-shadow:0 3px 0 #0d0a2e}
.chip.rank{flex:1;min-width:0}
.lv{width:30px;height:30px;border-radius:50%;background:var(--ch);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:15px;flex:none}
.xp{flex:1;height:10px;border-radius:6px;background:#ddd2fb;border:2px solid var(--ink);overflow:hidden;min-width:30px}
.xp i{display:block;height:100%;background:var(--pink);transition:width .5s}
.chip.coin svg{width:22px;height:22px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 #0d0a2e;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(3px);box-shadow:none}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:3px solid var(--ink)}
/* ---------- home ---------- */
#scene{border-radius:18px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 5px 0 #0d0a2e;position:relative}
#scene svg{width:100%;height:auto}
#sceneTitle{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:72%}
#sceneTitle small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 9px;border-radius:99px}
#sceneTitle b{font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:2px 11px 3px;box-shadow:0 3px 0 #0d0a2e}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;border-radius:14px;padding:6px 2px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 #0d0a2e;display:flex;flex-direction:column;align-items:center;font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.1}
.tab small{font-family:var(--font);font-size:10px;font-weight:700;color:#6a5aa8}
.tab.sel{background:var(--ch)}.tab.sel small{color:var(--ink)}
.tab.lock{opacity:.6}.tab svg{width:14px;height:14px}
#nights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nb{aspect-ratio:1.15;border-radius:18px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 #0d0a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:23px;line-height:1;position:relative}
.nb small{font-family:var(--font);font-size:11px;font-weight:800;margin-top:2px;min-height:12px;letter-spacing:.04em;color:#a06a00}
.nb.done{background:var(--ch)}.nb.done small{color:var(--ink)}
.nb.next{background:#fff;animation:hop 1.6s ease-in-out infinite}
.nb.boss::after{content:'✿';position:absolute;top:-9px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.nb:disabled{background:rgba(243,236,255,.14);color:rgba(243,236,255,.55);box-shadow:none;border-color:rgba(10,6,40,.6)}
.nb:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.nb svg{width:18px;height:18px;color:rgba(243,236,255,.6)}
@keyframes hop{50%{transform:translateY(-4px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:12px;text-align:left;border:3px solid var(--ink);box-shadow:0 4px 0 #0d0a2e;display:flex;flex-direction:column;gap:2px;position:relative;color:var(--ink)}
.mode b{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.1}.mode span{font-size:12px;font-weight:700;line-height:1.2}
.mode.daily{background:linear-gradient(#ffe08a,#ffc23a)}.mode.endless{background:linear-gradient(#8ff0e4,#4fd6c4)}
.mode:disabled{filter:grayscale(1) opacity(.5);box-shadow:none}
.mode:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.mode .badge{position:absolute;top:8px;right:8px;font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:0 7px}
#cont{width:100%;border-radius:16px;padding:10px 18px;text-align:left;font-size:21px;display:flex;justify-content:space-between;align-items:center}
#cont small{display:block;font-family:var(--font);letter-spacing:0;font-weight:700;font-size:12px}
.sub{color:var(--muted);font-size:13px;text-align:center}
.linkbtn{min-height:44px;align-self:center;color:var(--paper);font-weight:800;font-size:14px;padding:8px 16px;border-radius:99px;text-decoration:underline;text-underline-offset:3px}
/* ---------- game ---------- */
#game{gap:8px}
.gtop{display:flex;align-items:center;gap:8px}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b{font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #0d0a2e}
.gt small{font-size:12px;color:var(--muted)}
#goals{display:flex;gap:10px;align-items:center}
.gbox{flex:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 #0d0a2e;padding:4px 9px 5px;display:flex;flex-direction:column;gap:3px}
.gbox .t{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;align-items:baseline}
.gbox .t span{overflow:hidden;text-overflow:ellipsis;font-size:11px}.gbox .t b{font-family:var(--disp);font-weight:700;font-size:17px}
.gbar{height:9px;border-radius:5px;border:2px solid var(--ink);background:#ddd2fb;overflow:hidden}.gbar i{display:block;height:100%;background:var(--pink);transition:width .35s}
.gbox.low .t b{color:#d62839;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.45}}
#stage{position:relative;flex:1;min-height:200px;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:radial-gradient(90% 60% at 50% 30%,#3a2d9a 0%,#241a74 55%,#140e45 100%);box-shadow:0 4px 0 #0d0a2e}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:2.6em;line-height:1.3;padding:0 6px}
.boosters{display:flex;gap:8px}
.bst{flex:1;border-radius:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 #0d0a2e;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px}
.bst svg{width:22px;height:22px}
.bst em{font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px}
.bst em svg{width:12px;height:12px}
.bst:disabled{opacity:.45;box-shadow:none}.bst:active:not(:disabled){transform:translateY(3px);box-shadow:none}
/* ---------- result ---------- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,6,40,.74);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:22px 18px 18px;max-width:350px;width:100%;display:flex;flex-direction:column;gap:11px;text-align:center;box-shadow:0 0 0 4px var(--gold),0 18px 40px rgba(0,0,0,.55);animation:cardIn .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:30px;line-height:1.1}
.card p{font-size:14px;color:#5a4a98;line-height:1.4;font-weight:700}
.rstars{display:flex;justify-content:center;gap:8px;min-height:60px}
.rstars svg{width:56px;height:56px;color:#ddd2fb;transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.8,.4,1),color .2s}
.rstars svg.on{color:#ffc23a;transform:scale(1) rotate(-6deg)}
.rstars svg path{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.rwd{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.rwd span{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:3px 12px;font-family:var(--disp);font-weight:700;font-size:17px}
.rwd svg{width:20px;height:20px}
.btn{border-radius:14px;padding:12px;font-family:var(--disp);font-weight:700;font-size:18px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 #0d0a2e;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.btn small{font-family:var(--font);letter-spacing:0;font-weight:700;font-size:11.5px;display:flex;align-items:center;gap:5px}
.btn small svg{width:14px;height:14px}
.btn.main{background:linear-gradient(#ffe08a,#ffc23a)}.btn.vid{background:linear-gradient(#8ff0e4,#4fd6c4)}
.btn:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;gap:8px}.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/*PERF*/
/* performance: composited-only animation (transform/opacity), no blur/blend; low-end devices get a lighter mode */
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
html.lowfx .cf{display:none}
/*END-PERF*/
/*LAYOUT*/
/* Layout for average Android phones: the game screen fills the viewport; the canvas stage takes all free height */
#game.scr.on{height:100vh;height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:6px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#game .hint{min-height:0;font-size:12.5px;line-height:1.25;margin:0}#game .hint:empty{display:none}
#game .boosters{gap:6px}#game .bst{min-height:52px;padding:4px 2px;font-size:11px}
#game .ib{width:40px;height:40px}
#stage{flex:1 1 0;min-height:0}
@media (max-height:620px){#game .hint{display:none}#game .bst{min-height:46px}#game .bst em{display:none}}
/*END-LAYOUT*/
/*COMPAT*/
/* small / narrow phones (320-360px) and long translations: nothing may overflow or clip */
.row{flex-wrap:wrap}
.row .btn{min-width:0;flex:1 1 84px;padding-left:6px;padding-right:6px;font-size:17px}
#game .bst{min-width:0;overflow:hidden}
#game .bst span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt b{line-height:1.2;padding-top:1px}
@media (max-width:370px){#game .bst span{font-size:10px}#game .bst{font-size:10px}.row .btn{font-size:16px}.card{padding-left:14px;padding-right:14px}.cta{font-size:21px;padding:11px 20px}.mode b{font-size:18px}}
.k-card{max-width:calc(100vw - 24px)}
#game #bGameSet span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#game #bGameSet svg{width:24px;height:24px}
/*END-COMPAT*/
html.lowfx #halo,html.lowfx .st{display:none}
</style>
</head>

/* ---- SVG mandala art (intro halo, home scene, tutorial) ---- */
function petalPath(cx, cy, a, r0, r1, w) { // an almond petal from radius r0 to r1 pointing along angle a
  var ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca, mid = (r0 + r1) / 2, x0 = cx + ca * r0, y0 = cy + sa * r0, x1 = cx + ca * r1, y1 = cy + sa * r1, mx = cx + ca * mid, my = cy + sa * mid;
  return 'M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + 'Q' + (mx + px * w).toFixed(1) + ' ' + (my + py * w).toFixed(1) + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + 'Q' + (mx - px * w).toFixed(1) + ' ' + (my - py * w).toFixed(1) + ' ' + x0.toFixed(1) + ' ' + y0.toFixed(1) + 'Z';
}
function haloSvg() {
  var s = '<svg viewBox="-200 -200 400 400" fill="none" stroke="#c9b8ff" stroke-width="1.2">', i, k;
  for (k = 0; k < 3; k++) for (i = 0; i < 16 + k * 8; i++) { var n = 16 + k * 8; s += '<path d="' + petalPath(0, 0, i * TAU / n - Math.PI / 2 + k * .1, 40 + k * 46, 90 + k * 52, 11 + k * 3) + '"/>'; }
  s += '<circle r="196" stroke-dasharray="2 8"/><circle r="30"/></svg>'; return s;
}
$('halo').innerHTML = haloSvg();

var CH_SKY = [['#4a3aa8', '#e08ab0'], ['#2a2a8a', '#6aa8d8'], ['#2b2560', '#8a8ab0'], ['#1a1250', '#7a5cd8'], ['#22104a', '#ffa05a']];
function scene(ch, lit) {
  var sk = CH_SKY[ch], s = '<svg viewBox="0 0 400 150" role="img" aria-hidden="true"><defs><linearGradient id="sg' + ch + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + sk[0] + '"/><stop offset="1" stop-color="' + sk[1] + '"/></linearGradient></defs><rect width="400" height="150" fill="url(#sg' + ch + ')"/>', i;
  for (i = 0; i < 26; i++) s += '<circle cx="' + ((i * 97) % 400) + '" cy="' + ((i * 53) % 90) + '" r="' + (.8 + (i % 3) * .5) + '" fill="#fff" opacity="' + (.3 + (i % 4) * .15) + '"/>';
  s += '<circle cx="330" cy="34" r="16" fill="#fff3c4" opacity=".9"/>';
  // concentric lotus: 12 big petals (one per level) + inner ring + hub
  var cx = 200, cy = 82;
  for (i = 0; i < 12; i++) { var a = i * TAU / 12 - Math.PI / 2, on = lit[i]; s += '<path d="' + petalPath(cx, cy, a, 22, 74, 15) + '" fill="' + (on ? PCOL[(i + ch) % 6] : 'rgba(243,236,255,.14)') + '" stroke="' + (on ? INK : 'rgba(243,236,255,.35)') + '" stroke-width="' + (on ? 2.5 : 1.2) + '" stroke-linejoin="round"/>'; if (on) s += '<path d="' + petalPath(cx, cy, a, 30, 62, 7) + '" fill="#fff" opacity=".3"/>'; }
  for (i = 0; i < 12; i++) { var b = (i + .5) * TAU / 12 - Math.PI / 2; s += '<path d="' + petalPath(cx, cy, b, 20, 40, 8) + '" fill="' + (lit[i] && lit[(i + 1) % 12] ? '#ffe08a' : 'rgba(243,236,255,.1)') + '" stroke="' + INK + '" stroke-width="' + (lit[i] && lit[(i + 1) % 12] ? 2 : 0) + '" opacity=".9"/>'; }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="13" fill="#fff3c4" stroke="' + INK + '" stroke-width="3"/><circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#9b7cff"/>';
  s += '<path d="M0 128Q50 120 100 128T200 128T300 128T400 128V150H0z" fill="#0d0a2e" opacity=".5"/>';
  return s + '</svg>';
}

var P = Object.assign({ stars: [], endlessBest: 0, daily: { key: '', done: false }, chSeen: {}, fin: false }, K.save.get('p', {}));
while (P.stars.length < LEVELS.length) P.stars.push(0);
function saveP() { K.save.set('p', P); }
function starsTotal() { return P.stars.reduce(function (a, b) { return a + b; }, 0); }
function winsTotal() { return P.stars.filter(function (x) { return x > 0; }).length; }
function chStars(k) { var t = 0; for (var j = 0; j < PER; j++) t += P.stars[k * PER + j]; return t; }
function unlocked(i) { return i === 0 || (P.stars[i - 1] > 0 && (i % PER !== 0 || chStars(i / PER - 1) >= GATE)); }
function nextLevel() {
  var i = P.stars.findIndex(function (x) { return x === 0; }); if (i < 0) return LEVELS.length - 1;
  if (unlocked(i)) return i;
  var k = Math.floor(i / PER) - 1, best = k * PER, j; for (j = 0; j < PER; j++) if (P.stars[k * PER + j] < P.stars[best]) best = k * PER + j; return best;
}
var selCh = Math.floor(nextLevel() / PER);
var S = null, pendingEnd = false, endlessN = 0, carry = 0;
function endlessOpen() { return P.stars[3] > 0; }
