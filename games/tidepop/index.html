<style>
/* Tidepop art direction: deep-sea glass. Poppins, translucent panels, bubble buttons, jelly-glossy sea creatures, caustic light. */
:root{
  --bg:#04202f; --bg2:#073b55; --ink:#eafcff; --muted:#8fc2d1; --accent:#3ee0d0; --line:rgba(190,240,255,.16);
  --glass:rgba(160,230,255,.09); --glass2:rgba(160,230,255,.15); --ch:#3ee0d0;
  --k-card:#0b3a52; --k-ink:#eafcff; --k-muted:#9bcad8; --k-btn:rgba(160,230,255,.14); --k-on-accent:#032a2e; --k-line:rgba(190,240,255,.18); --k-font:'Poppins','DM Sans',system-ui,sans-serif; --k-scrim:rgba(2,16,26,.86);
  --font:'Poppins','DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(ellipse 130% 55% at 50% -6%,#12839a 0%,#0a4a68 38%,var(--bg) 78%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;flex-direction:column;gap:12px;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.scr.on{display:flex;animation:scrIn .3s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block}
b,.logo,h2{font-weight:700}
/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:8px;overflow:hidden;position:relative}
#intro.on{animation:none}
.sea{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.sea i{position:absolute;bottom:-40px;border-radius:50%;border:1.5px solid rgba(200,248,255,.55);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,.04) 55%);animation:bub linear infinite}
@keyframes bub{0%{transform:translate(0,0) scale(.7);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx,14px),-112vh) scale(1.05);opacity:.8}}
.logo{position:relative;font-size:clamp(64px,22vw,104px);letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#fff 5%,#9ef3ff 48%,#2fc7d9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(40,220,230,.45));animation:logoIn 1.1s cubic-bezier(.2,1.2,.3,1) both}
@keyframes logoIn{from{opacity:0;transform:translateY(26px) scale(.86);filter:blur(8px)}to{opacity:1;transform:none}}
