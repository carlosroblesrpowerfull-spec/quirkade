<style>
/* Pinata Pop art direction: fiesta at dusk. Purple-to-orange sunset sky, papel picado bunting, glossy candy buttons, cream paper cards, Anton headlines. */
:root{
  --bg:#2a0f4d; --paper:#fff3dc; --ink:#2b1038; --muted:#b79bd0; --accent:#ffb627; --ch:#ffb627; --pink:#ff3d81; --teal:#19d3c5; --line:rgba(43,16,56,.95);
  --k-card:#fff3dc; --k-ink:#2b1038; --k-muted:#7a5a8a; --k-btn:rgba(43,16,56,.10); --k-on-accent:#2b1038; --k-line:rgba(43,16,56,.95); --k-font:'DM Sans',system-ui,sans-serif; --k-scrim:rgba(20,6,40,.72);
  --disp:'Anton','DM Sans',Impact,system-ui,sans-serif; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--paper);font-family:var(--font);font-weight:700;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:linear-gradient(#2a0f4d,#7a2a7a 38%,#e0486f 72%,#ff9a3c) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;flex-direction:column;gap:12px;min-height:100vh;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));position:relative}
.scr.on{display:flex;animation:scrIn .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block}
h2,.logo,.d{font-family:var(--disp);font-weight:400;letter-spacing:.02em;text-transform:uppercase}
/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:10px;overflow:hidden}
#intro.on{animation:none}
#bunt{position:absolute;left:0;right:0;top:0;pointer-events:none}
#bunt svg{width:100%;height:auto;animation:sway 4s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.cf{position:absolute;width:10px;height:16px;border-radius:2px;top:-20px;animation:fall 7s linear infinite;pointer-events:none}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.logo{position:relative;font-size:clamp(64px,22vw,108px);line-height:.95;color:#fff3dc;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--pink),0 10px 0 var(--ink);animation:logoIn .8s cubic-bezier(.2,1.5,.4,1) both;text-align:center}
@keyframes logoIn{from{opacity:0;transform:translateY(30px) scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
.tag{position:relative;font-size:17px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:6px 16px;max-width:300px;line-height:1.2;opacity:0;animation:fadeUp .6s .5s ease-out forwards;box-shadow:0 4px 0 var(--ink)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.06)}}
.pin-hero{position:relative;width:min(40vw,150px);animation:hang 2.6s ease-in-out infinite alternate;transform-origin:50% -60px;margin-bottom:6px}
@keyframes hang{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.cta{position:relative;font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em;background:linear-gradient(#ffd45a,#ffb627);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 26px;font-size:24px;box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55);transition:transform .08s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
#tapStart{margin-top:22px;opacity:0;animation:fadeUp .6s 1.2s ease-out forwards,pulse 1.6s 2s ease-in-out infinite}
/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 12px 4px 5px;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.chip.rank{flex:1;min-width:0}
.lv{width:30px;height:30px;border-radius:50%;background:var(--ch);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;flex:none}
.xp{flex:1;height:10px;border-radius:6px;background:#e5d4ee;border:2px solid var(--ink);overflow:hidden;min-width:30px}
.xp i{display:block;height:100%;background:var(--pink);transition:width .5s}
.chip.coin svg{width:22px;height:22px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(3px);box-shadow:none}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:3px solid var(--ink)}
/* ---------- home ---------- */
#scene{border-radius:18px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);position:relative}
#scene svg{width:100%;height:auto}
#sceneTitle{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:72%}
#sceneTitle small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 9px;border-radius:99px}
#sceneTitle b{font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.05;text-transform:uppercase;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:2px 11px 3px;box-shadow:0 3px 0 var(--ink)}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;border-radius:14px;padding:6px 2px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;font-family:var(--disp);font-size:19px;line-height:1.1}
.tab small{font-family:var(--font);font-size:10px;font-weight:700;color:#7a5a8a}
.tab.sel{background:var(--ch)}.tab.sel small{color:var(--ink)}
.tab.lock{opacity:.6}.tab svg{width:14px;height:14px}
#nights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nb{aspect-ratio:1.15;border-radius:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:24px;line-height:1;position:relative}
.nb small{font-family:var(--font);font-size:11px;font-weight:800;margin-top:2px;min-height:12px;letter-spacing:.04em;color:#c46a00}
.nb.done{background:var(--ch)}.nb.done small{color:var(--ink)}
.nb.next{background:#fff;animation:hop 1.2s ease-in-out infinite}
.nb.boss::after{content:'★';position:absolute;top:-10px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.nb:disabled{background:rgba(255,243,220,.28);color:rgba(255,243,220,.6);box-shadow:none;border-color:rgba(43,16,56,.5)}
.nb:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.nb svg{width:18px;height:18px;color:rgba(255,243,220,.7)}
@keyframes hop{50%{transform:translateY(-5px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:12px;text-align:left;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:2px;position:relative;color:var(--ink)}
.mode b{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1.05;text-transform:uppercase}.mode span{font-size:12px;font-weight:700;line-height:1.2}
.mode.daily{background:linear-gradient(#ffd45a,#ffb627)}.mode.endless{background:linear-gradient(#5ff0e2,#19d3c5)}
.mode:disabled{filter:grayscale(1) opacity(.55);box-shadow:none}
.mode:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.mode .badge{position:absolute;top:8px;right:8px;font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:0 7px}
#cont{width:100%;border-radius:16px;padding:10px 18px;text-align:left;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#cont small{display:block;font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:700;font-size:12px}
.sub{color:var(--paper);font-size:13px;text-align:center;text-shadow:0 2px 0 rgba(43,16,56,.6)}
.linkbtn{min-height:44px;align-self:center;color:var(--paper);font-weight:800;font-size:14px;padding:8px 16px;border-radius:99px;text-decoration:underline;text-underline-offset:3px}
/* ---------- game ---------- */
#game{gap:8px}
.gtop{display:flex;align-items:center;gap:8px}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;text-shadow:0 3px 0 var(--ink)}
.gt small{font-size:12px;color:var(--paper);text-shadow:0 2px 0 rgba(43,16,56,.6)}
#goals{display:flex;gap:10px;align-items:center}
.gbox{flex:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:4px 9px 5px;display:flex;flex-direction:column;gap:3px}
.gbox .t{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;align-items:baseline}
.gbox .t span{overflow:hidden;text-overflow:ellipsis;font-size:11px}.gbox .t b{font-family:var(--disp);font-weight:400;font-size:17px}
.gbar{height:9px;border-radius:5px;border:2px solid var(--ink);background:#e5d4ee;overflow:hidden}.gbar i{display:block;height:100%;background:var(--pink);transition:width .35s}
.gbox.low .t b{color:#d62839;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.45}}
#stage{position:relative;flex:1;min-height:200px;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(#3a1566,#9a2f86 45%,#f0586a 80%,#ffa045);box-shadow:0 4px 0 var(--ink)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
.hint{font-size:13px;color:var(--paper);text-align:center;min-height:2.6em;line-height:1.3;padding:0 6px;text-shadow:0 2px 0 rgba(43,16,56,.55)}
.boosters{display:flex;gap:8px}
.bst{flex:1;border-radius:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px}
.bst svg{width:22px;height:22px}
.bst em{font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px}
.bst em svg{width:12px;height:12px}
.bst.on{background:var(--teal)}
.bst:disabled{opacity:.45;box-shadow:none}.bst:active:not(:disabled){transform:translateY(3px);box-shadow:none}
/* ---------- result ---------- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,6,40,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:22px 18px 18px;max-width:350px;width:100%;display:flex;flex-direction:column;gap:11px;text-align:center;box-shadow:0 0 0 4px var(--pink),0 18px 40px rgba(0,0,0,.55);animation:cardIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{from{transform:scale(.8) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:32px;line-height:1.05}
.card p{font-size:14px;color:#6a4a7a;line-height:1.4;font-weight:700}
.rstars{display:flex;justify-content:center;gap:8px;min-height:60px}
.rstars svg{width:56px;height:56px;color:#e5d4ee;transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.8,.4,1),color .2s}
.rstars svg.on{color:#ffb627;transform:scale(1) rotate(-6deg)}
.rstars svg path{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.rwd{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.rwd span{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:3px 12px;font-family:var(--disp);font-size:17px}
.rwd svg{width:20px;height:20px}
.btn{border-radius:14px;padding:12px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;font-size:19px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.05}
.btn small{font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:700;font-size:11.5px;display:flex;align-items:center;gap:5px}
.btn small svg{width:14px;height:14px}
.btn.main{background:linear-gradient(#ffd45a,#ffb627)}.btn.vid{background:linear-gradient(#5ff0e2,#19d3c5)}
.btn:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;gap:8px}.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.applogo{position:relative;width:min(34vw,148px);height:min(34vw,148px);border-radius:26%;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12);animation:logoPop 1s cubic-bezier(.2,1.5,.4,1) both,logoFloat 4s 1s ease-in-out infinite alternate;margin-bottom:10px;z-index:2}@keyframes logoPop{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}@keyframes logoFloat{to{transform:translateY(-7px)}}

/*PERF*/
/* performance: composited-only animation (transform/opacity), no blur/blend; low-end devices get a lighter mode */
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
html.lowfx .cf{display:none}
/*END-PERF*/
/*LAYOUT*/
/* Layout for average Android phones: the game screen fills the viewport; the canvas stage takes all free height */
#game.scr.on{height:100vh;height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:6px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#game .hint{min-height:0;font-size:12.5px;line-height:1.25;margin:0}#game .hint:empty{display:none}
#game .boosters{gap:6px}#game .bst{min-height:52px;padding:4px 2px;font-size:11px}
#game .ib{width:40px;height:40px}
#stage{flex:1 1 0;min-height:0}
@media (max-height:620px){#game .hint{display:none}#game .bst{min-height:46px}#game .bst em{display:none}}
/*END-LAYOUT*/

/*COMPAT*/
/* small / narrow phones (320-360px) and long translations: nothing may overflow or clip */
.row{flex-wrap:wrap}
.row .btn{min-width:0;flex:1 1 84px;padding-left:6px;padding-right:6px;font-size:17px}
#game .bst{min-width:0;overflow:hidden}
#game .bst span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt b{line-height:1.2;padding-top:1px}
@media (max-width:370px){#game .bst span{font-size:10px}#game .bst{font-size:10px}.row .btn{font-size:16px}.card{padding-left:14px;padding-right:14px}.cta{font-size:21px;padding:11px 20px}.mode b{font-size:18px}}
.k-card{max-width:calc(100vw - 24px)}
#game #bGameSet span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#game #bGameSet svg{width:24px;height:24px}
/*END-COMPAT*/
</style>
</head>
