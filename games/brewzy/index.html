<style>
/* Brewzy art direction: apothecary at night. Dark wood and iron, parchment order tickets, brass plates, glowing potion colours. Serif (Cardo) everywhere. */
:root{
  --bg:#1b1410; --wood:#2a1d15; --paper:#f1e3c3; --paper2:#e6d3a8; --ink:#2a1a12; --muted:#a58b6a; --accent:#7be08a; --ch:#7be08a; --brass:#d9a441; --brass2:#8a5a1c; --glow:#ffcf6e; --line:rgba(42,26,18,.95);
  --k-card:#f1e3c3; --k-ink:#2a1a12; --k-muted:#7a6246; --k-btn:rgba(42,26,18,.10); --k-on-accent:#2a1a12; --k-line:rgba(42,26,18,.95); --k-font:'Cardo',Georgia,'Times New Roman',serif; --k-scrim:rgba(10,6,3,.72);
  --disp:'Cardo',Georgia,'Times New Roman',serif; --font:'Cardo',Georgia,'Times New Roman',serif; --tk:46px; --slot:30px; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--paper);font-family:var(--font);font-weight:700;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;flex-direction:column;gap:12px;min-height:100vh;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));position:relative}
.scr.on{display:flex;animation:scrIn .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block}
h2,.logo,.d{font-family:var(--disp);font-weight:700}
/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:10px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#3a2616 0,#1b1410 70%)}
#intro.on{animation:none}
.glowb{position:absolute;pointer-events:none;border-radius:50%;filter:none;animation:glow 6s ease-in-out infinite alternate}
.glowb.a{width:260px;height:260px;left:-90px;top:-40px;background:radial-gradient(circle,rgba(123,224,138,.35),transparent 68%)}
.glowb.b{width:240px;height:240px;right:-80px;bottom:60px;background:radial-gradient(circle,rgba(180,110,255,.30),transparent 68%);animation-delay:-3s}
.glowb.c{width:200px;height:200px;left:30%;bottom:-70px;background:radial-gradient(circle,rgba(255,190,90,.28),transparent 68%);animation-delay:-1.5s}
@keyframes glow{to{transform:translate(14px,-18px) scale(1.12)}}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,225,170,.5);animation:rise 7s linear infinite;pointer-events:none}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-110vh);opacity:0}}
.logo{position:relative;font-size:clamp(64px,22vw,104px);line-height:1;letter-spacing:.01em;color:var(--paper);text-shadow:0 4px 0 #6b3f12,0 0 30px rgba(255,190,90,.4);animation:logoIn .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes logoIn{from{opacity:0;transform:translateY(30px) scale(.8) rotate(-3deg)}to{opacity:1;transform:none}}
.tag{position:relative;font-size:18px;color:var(--paper2);font-style:italic;max-width:280px;line-height:1.25;opacity:0;animation:fadeUp .6s .5s ease-out forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.05)}}
.cta{position:relative;font-family:var(--disp);background:linear-gradient(#f0c15f,#d9a441);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 26px;font-size:21px;box-shadow:0 5px 0 var(--brass2),0 8px 18px rgba(0,0,0,.45);transition:transform .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass2)}
#tapStart{margin-top:26px;opacity:0;animation:fadeUp .6s 1.2s ease-out forwards,pulse 1.8s 2s ease-in-out infinite}
/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--wood);border:2px solid var(--brass2);border-radius:99px;padding:5px 12px 5px 6px;font-size:16px;color:var(--paper);box-shadow:inset 0 0 0 1px rgba(255,220,150,.12)}
.chip.rank{flex:1;min-width:0}
.lv{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe29a,#d9a441);color:var(--ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.xp{flex:1;height:9px;border-radius:6px;background:#120c08;border:1px solid var(--brass2);overflow:hidden;min-width:30px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#4fbf6a,#9af0a8);transition:width .5s}
.chip.coin svg{width:22px;height:22px}
.ib{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#4a3424,#2a1d15);border:2px solid var(--brass);box-shadow:0 3px 0 #0e0805;display:flex;align-items:center;justify-content:center;position:relative;color:var(--paper);flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(3px);box-shadow:none}
.dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#ef476f;border:2px solid var(--bg)}
/* ---------- home ---------- */
#scene{border-radius:16px;overflow:hidden;border:2px solid var(--brass);box-shadow:0 6px 0 #0e0805,0 10px 24px rgba(0,0,0,.5);position:relative}
#scene svg{width:100%;height:auto}
#sceneTitle{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:70%}
#sceneTitle small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:rgba(20,12,6,.82);color:var(--glow);padding:2px 9px;border-radius:99px;border:1px solid var(--brass2)}
#sceneTitle b{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.05;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:2px 11px 3px;box-shadow:0 3px 0 var(--brass2)}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;border-radius:12px;padding:7px 2px;background:var(--wood);border:2px solid var(--brass2);display:flex;flex-direction:column;align-items:center;font-family:var(--disp);font-size:18px;color:var(--paper);line-height:1.1}
.tab small{font-family:var(--font);font-size:11px;font-weight:700;color:var(--muted)}
.tab.sel{background:linear-gradient(#f0c15f,#d9a441);color:var(--ink);border-color:var(--ink)}.tab.sel small{color:var(--ink)}
.tab.lock{opacity:.55}.tab svg{width:14px;height:14px}
#nights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nb{aspect-ratio:1.15;border-radius:12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 #0e0805;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:22px;line-height:1;position:relative}
.nb small{font-family:var(--font);font-size:11px;font-weight:700;margin-top:2px;min-height:12px;letter-spacing:.04em;color:#a8761c}
.nb.done{background:linear-gradient(#bff0c4,#7fd48c)}.nb.done small{color:#8a5a1c}
.nb.next{background:linear-gradient(#ffe29a,#f0b840);animation:hop 1.2s ease-in-out infinite}
.nb.boss::after{content:'★';position:absolute;top:-10px;right:-8px;width:22px;height:22px;border-radius:50%;background:#6b3fd0;color:#fff;border:2px solid var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center}
.nb:disabled{background:#3a2a1e;color:var(--muted);box-shadow:none;border-color:#120c08}
.nb:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.nb svg{width:18px;height:18px;color:var(--muted)}
@keyframes hop{50%{transform:translateY(-5px)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:14px;padding:12px;text-align:left;border:2px solid var(--ink);box-shadow:0 4px 0 #0e0805;display:flex;flex-direction:column;gap:2px;position:relative;color:var(--ink)}
.mode b{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.05}.mode span{font-size:13px;font-weight:400;line-height:1.2;font-style:italic}
.mode.daily{background:linear-gradient(#ffc36a,#e8952c)}.mode.endless{background:linear-gradient(#c9a6ff,#9568e0)}
.mode:disabled{filter:grayscale(1) opacity(.5);box-shadow:none}
.mode:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.mode .badge{position:absolute;top:8px;right:8px;font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:0 7px}
#cont{width:100%;border-radius:14px;padding:12px 18px;text-align:left;font-size:20px;display:flex;justify-content:space-between;align-items:center}
#cont small{display:block;font-family:var(--font);font-weight:400;font-style:italic;font-size:13px}
.sub{color:var(--muted);font-size:14px;text-align:center}
.linkbtn{min-height:44px;align-self:center;color:var(--glow);font-size:15px;padding:8px 16px;border-radius:99px;text-decoration:underline;text-underline-offset:3px}
/* ---------- game ---------- */
#game{gap:8px}
.gtop{display:flex;align-items:center;gap:8px}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b{font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--paper)}
.gt small{font-size:13px;color:var(--muted)}
#goals{display:flex;gap:10px;align-items:center}
.gbox{flex:1;background:var(--wood);border:2px solid var(--brass2);border-radius:12px;padding:5px 9px 6px;display:flex;flex-direction:column;gap:3px}
.gbox .t{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-size:13px}
.gbox .t span{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.gbox .t b{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--paper)}
.gbar{height:8px;border-radius:5px;border:1px solid var(--brass2);background:#120c08;overflow:hidden}.gbar i{display:block;height:100%;background:linear-gradient(90deg,#4fbf6a,#9af0a8);transition:width .4s}
.gbox.low .t b{color:#ff7a6b;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.45}}
/* order tickets */
#orders{display:flex;gap:7px;align-items:stretch;min-height:76px}
.tkt{flex:1;min-width:0;background:linear-gradient(#f6ead0,#e8d6ab);color:var(--ink);border:2px solid var(--ink);border-radius:6px 6px 10px 10px;padding:12px 4px 6px;display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;position:relative;box-shadow:0 4px 0 #0e0805;animation:tktIn .35s cubic-bezier(.2,1.4,.4,1)}
.tkt::before{content:'';position:absolute;top:3px;left:50%;width:9px;height:9px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe29a,#8a5a1c);border:1px solid var(--ink)}
.tkt::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;background:radial-gradient(circle at 5px 0,transparent 4px,#e8d6ab 4.5px) 0 0/10px 6px repeat-x;opacity:.0}
@keyframes tktIn{from{transform:translateY(-14px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.tkt .tk{width:24px;height:24px;transition:opacity .25s,transform .25s}
.tkt .tk.off{opacity:.42;filter:grayscale(.5)}
.tkt .tk.on{transform:scale(1.1)}
.tkt.done{animation:stamp .5s ease-in forwards}
.tkt.done::after{content:'✓';opacity:1;position:absolute;top:0;right:0;bottom:0;left:0;left:0;right:0;top:0;bottom:0;height:auto;background:rgba(123,224,138,.8);display:flex;align-items:center;justify-content:center;font-size:34px;border-radius:5px;color:var(--ink)}
@keyframes stamp{0%{transform:scale(1)}30%{transform:scale(1.1) rotate(-2deg)}100%{transform:translateY(-26px) scale(.7);opacity:0}}
.tkt.nxt{box-shadow:0 4px 0 #0e0805,0 0 0 2px var(--glow)}
.qchip{flex:none;align-self:center;min-width:34px;height:34px;padding:0 6px;border-radius:50%;background:var(--wood);border:2px dashed var(--brass2);color:var(--glow);display:flex;align-items:center;justify-content:center;font-size:15px}
.tk{display:block}
/* cauldrons */
#stage{position:relative;flex:1;min-height:150px;display:flex;align-items:center;justify-content:center}
#pots{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%}
.pot{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.pot.target{animation:tgt 1s ease-in-out infinite}
@keyframes tgt{50%{transform:translateY(-4px)}}
.pot .rimb{width:calc(var(--cap) * (var(--slot) + 4px) + 30px);height:16px;border-radius:8px;background:linear-gradient(#f0c15f,#b98027);border:2px solid var(--ink);position:relative;z-index:2}
.pot .body{width:calc(var(--cap) * (var(--slot) + 4px) + 22px);margin-top:-3px;padding:9px 0 12px;background:radial-gradient(circle at 35% 25%,#4a3b33,#241a15 70%);border:2px solid var(--ink);border-radius:8px 8px 50% 50%/8px 8px 38px 38px;display:flex;justify-content:center;gap:4px;position:relative;overflow:hidden;min-height:calc(var(--slot) + 22px)}
.pot .body::before{content:'';position:absolute;left:0;right:0;bottom:0;top:35%;background:linear-gradient(rgba(123,224,138,.0),rgba(123,224,138,.28));pointer-events:none}
.slotc{width:var(--slot);height:var(--slot);border-radius:50%;border:2px dashed rgba(241,227,195,.28);flex:none;position:relative;z-index:1}
.slotc .tk{width:100%;height:100%;animation:drop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:translateY(-16px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.fire{display:flex;justify-content:center;gap:3px;height:20px;margin-top:-2px}
.fire i{width:12px;height:18px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#ffe27a,#ff7a2a);transform-origin:50% 100%;animation:flame .5s ease-in-out infinite alternate}
.fire i:nth-child(2){height:24px;animation-delay:-.2s}.fire i:nth-child(3){animation-delay:-.35s}
@keyframes flame{from{transform:scale(.85,.9)}to{transform:scale(1.1,1.12)}}
.potx{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 0 #0e0805}
.potx svg{width:16px;height:16px}
.potx::before{content:'';position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px}
.pot.bad{animation:bad .3s}
@keyframes bad{25%{margin-left:-5px;margin-right:5px}75%{margin-left:5px;margin-right:-5px}}
.pot.ruin .body{animation:ruin .7s}
@keyframes ruin{0%,100%{box-shadow:none}30%{box-shadow:inset 0 0 0 40px rgba(150,60,220,.7)}}
.pot.boil .body{animation:boil .6s}
@keyframes boil{30%{transform:scale(1.06)}60%{transform:scale(.97)}}
#fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:10;overflow:visible}
.ring{position:absolute;border-radius:50%;border:3px solid var(--glow);animation:ringo .6s ease-out forwards}
@keyframes ringo{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.conf{position:absolute;width:8px;height:8px;border-radius:50%;animation:confo .9s ease-out forwards}
@keyframes confo{to{transform:translate(var(--x),var(--y));opacity:0}}
.float{position:absolute;font-family:var(--disp);font-size:22px;color:var(--glow);text-shadow:0 2px 0 #000;animation:flo .9s ease-out forwards;white-space:nowrap}
@keyframes flo{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-50px) scale(1.1);opacity:0}}
.potion{position:absolute;width:34px;height:42px;animation:bottle .9s ease-out forwards;margin-left:-17px}
@keyframes bottle{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-90px) scale(1);opacity:0}}
.puff{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(150,80,210,.7);animation:puff .8s ease-out forwards}
@keyframes puff{from{transform:translate(-50%,0) scale(.4);opacity:.9}to{transform:translate(-50%,-40px) scale(1.8);opacity:0}}
.hint{font-size:13.5px;color:var(--muted);text-align:center;min-height:2.6em;line-height:1.3;padding:0 6px;font-weight:400;font-style:italic}
/* shelf */
#shelfRow{display:flex;align-items:center;justify-content:center;gap:10px}
#shelfBox{position:relative;padding:8px 8px 14px;background:linear-gradient(#3b2a1d,#2a1d15);border:2px solid var(--brass2);border-radius:10px;box-shadow:inset 0 -8px 0 #1a110b}
#shelf{position:relative;height:var(--tk);width:calc(var(--win) * (var(--tk) + 10px) - 10px)}
.it{position:absolute;left:0;top:0;width:var(--tk);height:var(--tk);transition:transform .32s cubic-bezier(.3,1.2,.5,1),opacity .3s;border-radius:50%}
.it .tk{width:100%;height:100%}
.it.sel{z-index:3}
.it.sel .tk{transform:translateY(-10px) scale(1.12);filter:drop-shadow(0 0 8px var(--glow))}
.it .tk{transition:transform .15s}
.it.hint .tk{animation:ihint .7s ease-in-out 2}
@keyframes ihint{50%{transform:translateY(-12px)}}
.it.new{animation:itIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes itIn{from{opacity:0}to{opacity:1}}
.it.fly{z-index:6;transition:transform .27s cubic-bezier(.4,0,.6,1),opacity .27s;opacity:.0}
.binbtn{width:54px;height:54px;border-radius:14px;background:radial-gradient(circle at 35% 28%,#4a3424,#2a1d15);border:2px solid var(--brass);box-shadow:0 3px 0 #0e0805;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--paper);font-size:10px;flex:none}
.binbtn svg{width:22px;height:22px}
.binbtn.target{animation:tgt 1s ease-in-out infinite;border-color:var(--glow)}
.binbtn:active{transform:translateY(3px);box-shadow:none}
.binbtn span{font-weight:400;line-height:1}
.boosters{display:flex;gap:8px}
.bst{flex:1;border-radius:12px;background:var(--wood);border:2px solid var(--brass2);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--paper);box-shadow:0 3px 0 #0e0805}
.bst svg{width:22px;height:22px}
.bst em{font-style:normal;font-size:12px;display:flex;align-items:center;gap:3px;color:var(--glow)}
.bst em svg{width:12px;height:12px}
.bst:disabled{opacity:.4;box-shadow:none}.bst:active:not(:disabled){transform:translateY(3px);box-shadow:none}
/* ---------- result ---------- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,6,3,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:linear-gradient(#f6ead0,#e8d6ab);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:22px 18px 18px;max-width:350px;width:100%;display:flex;flex-direction:column;gap:11px;text-align:center;box-shadow:0 0 0 3px var(--brass),0 18px 40px rgba(0,0,0,.6);animation:cardIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{from{transform:scale(.8) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:29px;line-height:1.05}
.card p{font-size:16px;color:#6b5238;line-height:1.35;font-weight:400}
.rstars{display:flex;justify-content:center;gap:8px;min-height:60px}
.rstars svg{width:56px;height:56px;color:#cbb88f;transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.8,.4,1),color .2s}
.rstars svg.on{color:#f4b81f;transform:scale(1) rotate(-6deg)}
.rstars svg path{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.rwd{display:flex;justify-content:center;gap:8px}
.rwd span{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:3px 12px;font-family:var(--disp);font-size:17px}
.rwd svg{width:20px;height:20px}
.btn{border-radius:12px;padding:12px;font-family:var(--disp);font-size:18px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--brass2);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.btn small{font-family:var(--font);font-weight:400;font-style:italic;font-size:13px;display:flex;align-items:center;gap:5px}
.btn small svg{width:14px;height:14px}
.btn.main{background:linear-gradient(#f0c15f,#d9a441)}.btn.vid{background:linear-gradient(#bff0c4,#7fd48c)}
.btn:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;gap:8px}.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-width:360px){:root{--tk:42px}}
.applogo{position:relative;width:min(34vw,148px);height:min(34vw,148px);border-radius:26%;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12);animation:logoPop 1s cubic-bezier(.2,1.5,.4,1) both,logoFloat 4s 1s ease-in-out infinite alternate;margin-bottom:10px;z-index:2}@keyframes logoPop{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}@keyframes logoFloat{to{transform:translateY(-7px)}}

/*PERF*/
/* performance: composited-only animation (transform/opacity), no blur/blend; low-end devices get a lighter mode */
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
html.lowfx .it,html.lowfx .pot{transition-duration:.12s!important}
html.lowfx .bub,html.lowfx .glowb{display:none}
/*END-PERF*/
/*LAYOUT*/
/* Layout for average Android phones: the game screen fills the viewport; cauldrons share the free height */
#game.scr.on{height:100vh;height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:6px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
:root{--bgfx:radial-gradient(circle at 15% 12%,rgba(123,224,138,.14),transparent 45%),radial-gradient(circle at 88% 85%,rgba(180,110,255,.16),transparent 50%),radial-gradient(circle at 80% 10%,rgba(255,190,90,.16),transparent 40%)}
#game::before{content:'';position:absolute;top:-14%;right:-14%;bottom:-14%;left:-14%;pointer-events:none;z-index:0;background:var(--bgfx);will-change:transform;animation:bgflow 22s ease-in-out infinite alternate}
@keyframes bgflow{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2.5%,0) scale(1.1)}}
#game>*{position:relative;z-index:1}
#game .hint{min-height:0;font-size:13px;line-height:1.25;margin:0}#game .hint:empty{display:none}
#game .boosters{gap:6px}#game .bst{min-height:52px;padding:4px 2px}
#game .ib{width:40px;height:40px}
#stage{flex:1 1 0;min-height:0;overflow:visible}
@media (max-height:640px){#game .hint{display:none}#game .bst{min-height:46px}#game .bst em{display:none}#orders{min-height:64px}:root{--tk:40px}}
/*END-LAYOUT*/

/*COMPAT*/
/* small / narrow phones (320-360px) and long translations: nothing may overflow or clip */
.row{flex-wrap:wrap}
.row .btn{min-width:0;flex:1 1 84px;padding-left:6px;padding-right:6px;font-size:17px}

<script>/* Brewzy engine: a shelf conveyor of ingredients, one or two cauldrons and a queue of customer orders.

  var css = '<style>.tz{display:flex;gap:18px;align-items:flex-end;justify-content:center;height:150px;position:relative}.tz .tk{width:38px;height:38px}.tz .pt{width:96px;position:relative}.tz .pt .rimb{height:14px;border-radius:7px;background:linear-gradient(#f0c15f,#b98027);border:2px solid #2a1a12;width:100%}.tz .pt .body{height:50px;margin-top:-3px;background:radial-gradient(circle at 35% 25%,#4a3b33,#241a15 70%);border:2px solid #2a1a12;border-radius:6px 6px 40px 40px;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden}.tz .pt .body .tk{width:24px;height:24px}.tz .fire{display:flex;justify-content:center;gap:3px;height:20px}.tz .fire i{width:12px;height:18px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#ffe27a,#ff7a2a);transform-origin:50% 100%;animation:flame .5s ease-in-out infinite alternate}'
    + '.tz .mv{animation:tmv 3.2s infinite}@keyframes tmv{0%,15%{transform:translate(0,0)}45%,70%{transform:translate(62px,-12px) scale(.7)}71%,100%{transform:translate(62px,-12px) scale(.7);opacity:0}}.tz .tkt{position:static;width:auto;flex:none;padding:12px 8px 8px;animation:none;display:flex;gap:4px}.tz .tkt .tk{width:26px;height:26px}'
    + '.tz .tick{position:absolute;right:calc(50% - 90px);top:8px;font-size:40px;color:#7be08a;text-shadow:0 2px 0 #000;animation:tick 3s infinite}@keyframes tick{0%,45%{opacity:0;transform:scale(.4)}60%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}.tz .bn{width:52px;height:52px;border-radius:14px;border:2px solid #d9a441;background:#2a1d15;display:flex;align-items:center;justify-content:center;color:#f1e3c3}.tz .bn svg{width:26px;height:26px}.tz .go{animation:tgo 3s infinite}@keyframes tgo{0%,20%{transform:translate(0,0)}55%,75%{transform:translate(0,0) translate(60px,-2px) scale(.5);opacity:0}100%{opacity:0}}</style>';
  var pot = function (items) { return '<div class="pt"><div class="rimb"></div><div class="body">' + items.map(function (t) { return tok(t); }).join('') + '</div><div class="fire"><i></i><i></i><i></i></div></div>'; };
  if (n === 1) return css + '<div class="tz"><div style="display:flex;gap:8px;align-items:flex-end">' + tok(0) + '<span class="mv" style="display:block">' + tok(2) + '</span>' + tok(1) + '</div>' + pot([0]) + '</div>';
  if (n === 2) return css + '<div class="tz" style="flex-direction:column;align-items:center;gap:8px;height:auto"><div class="tkt" style="position:relative">' + tok(0) + tok(2) + tok(2) + '</div>' + pot([0, 2, 2]) + '<span class="tick" style="right:calc(50% - 118px);top:60px">✓</span></div>';
  if (n === 3) return css + '<div class="tz"><div style="display:flex;gap:8px;align-items:center"><span class="go" style="display:block">' + tok(3) + '</span></div><div class="bn">' + ICON.bin + '</div>' + pot([4]) + '</div>';
  return css + '<div class="tz">' + tok(WILD) + tok(CURSE) + '<div style="display:flex;gap:8px;align-items:flex-end">' + pot([0]).replace('width:96px', '') + '</div></div>';
}
K.cfg.tutorial = function () { return [1, 2, 3, 4].map(function (n) { return { art: tutArt(n), title: tt('tutT' + n), text: tt('tutX' + n) }; }); };

/* ======================================================= boot */
K.i18n.onChange(function () { applyI18n(); if ($('home').classList.contains('on')) renderHome(); else if ($('game').classList.contains('on') && S) { $('gTitle').textContent = S.mode === 'journey' ? tt('level', { n: S.idx + 1 }) : S.mode === 'endless' ? tt('endless') : tt('dailyBrew'); $('bin').innerHTML = ICON.bin + '<span>' + tt('binL') + '</span>'; renderHud(); renderOrders(); } });
applyI18n();
try {
  var App = window.GPPlugin && window.GPPlugin('App');
  if (App && App.addListener) App.addListener('backButton', function () {
    if (document.querySelector('.k-ov,.gp-ov')) { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); return; }
    if ($('res').classList.contains('show')) return;
    if ($('game').classList.contains('on')) { goHome(); return; }
    if ($('home').classList.contains('on')) { App.exitApp && App.exitApp(); }
  });
} catch (e) {}
window.addEventListener('resize', function () { if (S) { fitPots(); renderShelf(); } });
window.__brewzy = { get S() { return S; }, P: P, E: E, tapItem: tapItem, tapPot: tapPot, doPick: doPick, finish: finish, startJourney: startJourney, startEndless: startEndless, startDaily: startDaily, goHome: goHome };
})();
</script>
<script>(function(){var L=[[".nb",1.15]];try{if(CSS.supports("aspect-ratio","1"))return}catch(e){}function run(){L.forEach(function(p){var els=document.querySelectorAll(p[0]);for(var i=0;i<els.length;i++){var e=els[i],w=e.offsetWidth;if(w){var h=Math.round(w/p[1])+"px";if(e.style.height!==h)e.style.height=h}}})}setInterval(run,400);window.addEventListener("resize",run);run()})();</script></body>
