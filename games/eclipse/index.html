<style>
:root{
  --bg:#0a0e33; --bg2:#141a52; --panel:#161d5a; --cell:#1d2570; --ink:#f4f6ff; --muted:#a3acdf; --accent:#ffd23f; --line:rgba(255,255,255,.12);
  --k-card:#171e5c; --k-ink:#f4f6ff; --k-muted:#aab3e6; --k-btn:rgba(255,255,255,.12); --k-font:'DM Sans',system-ui,sans-serif; --k-on-accent:#2a2000;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(ellipse 120% 60% at 50% -8%,#2b3fd8 0%,#121a68 45%,var(--bg) 80%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{display:none;flex-direction:column;gap:12px;min-height:100vh;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.scr.on{display:flex;animation:scrIn .28s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block}
/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:6px;overflow:hidden;position:relative}
#intro.on{animation:none}
.stars-bg{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.stars-bg i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.08}}
.cta{background:linear-gradient(180deg,#ffe27a,#ffb62e);color:#2a2000;font-weight:800;border-radius:999px;padding:15px 34px;font-size:18px;box-shadow:0 8px 28px rgba(255,190,50,.35),inset 0 1px 0 rgba(255,255,255,.6);min-height:52px}
.cta:active{transform:scale(.97)}
#tapStart{margin-top:30px;opacity:0;animation:fadeUp .6s 1.5s ease-out forwards,pulse 1.8s 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;min-height:40px;font-weight:800;font-variant-numeric:tabular-nums}
.chip.rank{flex:1;min-width:0}
.lv{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffe27a,#ffb62e);color:#2a2000;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex:none}
.xp{flex:1;height:7px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;min-width:30px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffe27a,#ffb62e);border-radius:5px;transition:width .5s}
.chip.coin{padding:6px 12px 6px 8px}.chip.coin svg{width:22px;height:22px}
.ib{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:scale(.94)}
.dot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 2px #121a68}
/* ---------- home ---------- */
#scene{border-radius:20px;overflow:hidden;border:1px solid var(--line);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#scene svg{width:100%;height:auto}
#sceneTitle{position:absolute;left:14px;bottom:10px;right:14px;display:flex;flex-direction:column;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#sceneTitle small{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
#sceneTitle b{font-size:24px;line-height:1.1;letter-spacing:-.02em}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;border-radius:14px;padding:9px 4px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:15px}
.tab small{font-size:11px;font-weight:600;color:var(--muted)}
.tab.sel{background:var(--ch,#ffb84a);color:#201800;border-color:transparent}
.tab.sel small{color:rgba(32,24,0,.75)}
.tab.lock{opacity:.45}
.tab svg{width:14px;height:14px}
#nights{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.nb{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:18px;position:relative;line-height:1}

.nb.boss::after{content:'';position:absolute;top:-5px;right:-5px;bottom:-5px;left:-5px;border-radius:50%;border:1px dashed var(--ch,#ffb84a);opacity:.55}

@keyframes glowp{50%{box-shadow:0 0 0 7px rgba(255,184,74,.18)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:18px;padding:14px;text-align:left;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:92px;position:relative;overflow:hidden}
.mode b{font-size:17px;letter-spacing:-.01em}.mode span{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.3}
.mode.daily{background:linear-gradient(145deg,rgba(255,140,60,.35),rgba(255,70,120,.18))}
.mode.endless{background:linear-gradient(145deg,rgba(80,170,255,.3),rgba(140,90,255,.2))}

.mode .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 8px}
#cont{width:100%;border-radius:18px;padding:14px 18px;text-align:left;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.sub{color:var(--muted);font-size:13px;text-align:center}
.linkbtn{align-self:center;color:var(--muted);font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
/* ---------- game ---------- */
#game{gap:10px}
.gtop{display:flex;align-items:center;gap:10px}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}

.gmeter.low b{color:#ff8a8a;animation:blink .9s infinite}
@keyframes blink{50%{opacity:.5}}
.hint{font-size:13.5px;color:var(--muted);text-align:center;min-height:2.7em;font-weight:500;padding:0 6px;line-height:1.35}
.boosters{display:flex;gap:8px}
.bst{flex:1;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid var(--line);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:800;min-height:62px;justify-content:center;position:relative}

.bst em svg{width:13px;height:13px}
.bst:disabled{opacity:.35;cursor:not-allowed}
.bst:active{transform:scale(.95)}
/* ---------- result ---------- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(6,8,30,.86);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:linear-gradient(180deg,#1f2878,#161d5a);border:1px solid var(--line);border-radius:24px;padding:22px 20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:11px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:cardIn .35s cubic-bezier(.2,1.25,.4,1)}
@keyframes cardIn{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:27px;letter-spacing:-.02em;line-height:1.1}
.card p{font-size:14.5px;color:var(--muted);line-height:1.4}
.rstars{display:flex;justify-content:center;gap:10px;min-height:56px}
.rstars svg{width:52px;height:52px;color:rgba(255,255,255,.16);transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.6,.4,1),color .3s}
.rstars svg.on{color:#ffc94a;transform:scale(1);filter:drop-shadow(0 0 12px rgba(255,190,60,.7))}
.rwd{display:flex;justify-content:center;gap:10px}
.rwd span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:99px;padding:6px 12px;font-weight:800;font-size:15px}
.rwd svg{width:20px;height:20px}
.btn{border-radius:16px;padding:13px 14px;font-weight:800;font-size:16px;background:rgba(255,255,255,.13);min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;line-height:1.15}
.btn small{font-weight:600;font-size:11.5px;opacity:.78;display:flex;align-items:center;gap:5px}
.btn small svg{width:14px;height:14px}
.btn.main{background:linear-gradient(180deg,#ffe27a,#ffb62e);color:#2a2000;box-shadow:0 6px 20px rgba(255,190,50,.3)}
.btn.vid{background:linear-gradient(180deg,#7ed6ff,#4aa6ff);color:#04243f}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-height:640px){.hint{min-height:0}#board{width:min(100%,calc(100vh - 300px));width:min(100%,calc(100dvh - 300px))}}

.logo{position:relative;font-size:clamp(64px,22vw,104px);font-weight:900;letter-spacing:-.05em;line-height:1;background:linear-gradient(180deg,#fff 5%,#ffe27a 50%,#ffa51f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,190,60,.5));animation:logoIn 1.1s .5s cubic-bezier(.2,1.2,.3,1) both}
.tag{font-size:18px;font-weight:600;color:#e7defa;opacity:0;animation:fadeUp .8s .8s ease-out forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.95;transform:none}}
@keyframes logoIn{from{opacity:0;transform:translateY(24px) scale(.86);filter:blur(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.05)}}
#eclipseArt{position:relative;width:150px;height:150px;margin-bottom:10px}
#eclipseArt .sun{position:absolute;top:22px;right:22px;bottom:22px;left:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7c8,#ffc43a 60%,#ff9a1f);box-shadow:0 0 0 0 rgba(255,200,60,.0),0 0 60px 20px rgba(255,190,50,.55);animation:corona 3.6s 1.2s ease-in-out both}
#eclipseArt .moon{position:absolute;top:20px;right:20px;bottom:20px;left:20px;border-radius:50%;background:#04061c;box-shadow:inset -6px -4px 0 rgba(120,140,255,.18);animation:moonPass 3.6s ease-in-out both}
#eclipseArt .ring{position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.18);animation:spin 14s linear infinite}
#eclipseArt .ring::after{content:'';position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#04061c;border:2px solid #fff}
@keyframes moonPass{0%{transform:translateX(-120px)}55%,100%{transform:translateX(0)}}
@keyframes corona{0%,45%{box-shadow:0 0 0 0 rgba(255,200,60,0),0 0 30px 6px rgba(255,190,50,.3)}75%,100%{box-shadow:0 0 0 10px rgba(255,230,150,.25),0 0 90px 34px rgba(255,200,70,.75)}}
@keyframes spin{to{transform:rotate(360deg)}}
#arena{position:relative;width:min(100%,calc(100vh - 330px));width:min(100%,calc(100dvh - 330px));aspect-ratio:1;margin:0 auto;min-width:260px;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,var(--b1,#1b2fd6),var(--b2,#0b1260) 75%);box-shadow:0 12px 34px rgba(0,0,0,.4);touch-action:none;cursor:pointer}
#cv{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
#arenaMsg{position:absolute;left:0;right:0;top:6%;text-align:center;font-weight:800;font-size:15px;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;padding:0 14px}
#arenaMsg.pulse{animation:tapPulse 1s ease-in-out infinite;font-size:20px}
@keyframes tapPulse{50%{transform:scale(1.12);opacity:.7}}
#arenaBig{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:900;font-size:min(30vw,150px);opacity:.14;pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
#lives{display:flex;gap:7px;align-items:center;justify-content:center;min-height:26px}
#lives svg{width:24px;height:24px;transition:transform .25s,opacity .25s}
#lives svg.lost{opacity:.22;transform:scale(.8)}
#lives svg.pop{animation:lpop .4s}
@keyframes lpop{50%{transform:scale(1.45)}}
#goalLine{text-align:center;font-weight:800;font-size:15px}
#goalLine small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-top:1px}
.scr#game{gap:10px}
/*PERSONALITY*/

:root{--disp:'Anton','Archivo Black',Impact,sans-serif;--hud:rgba(150,200,255,.26);--cy:#6fe3ff;--bg:#04060f;--panel:rgba(110,150,255,.05);--k-font:'DM Sans',system-ui,sans-serif}
body{background:radial-gradient(ellipse 120% 70% at 50% 20%,#0b1230 0%,#05081a 55%,#02030a 100%) fixed}
body::before{content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;background:repeating-radial-gradient(circle at 50% 34%,transparent 0 62px,rgba(150,200,255,.045) 62px 63px),linear-gradient(90deg,transparent 49.8%,rgba(150,200,255,.05) 50%,transparent 50.2%),linear-gradient(0deg,transparent 33.8%,rgba(150,200,255,.05) 34%,transparent 34.2%)}
#app{z-index:1}
.logo,.gt b,.card h2,#sceneTitle b,.mode b,.nb,.gmeter b,.lv,.tab,#cont,.k-title{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.logo{font-size:clamp(78px,25vw,118px);letter-spacing:.06em;line-height:.95}
.tag{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.34em;color:#9fb6e8}
.chip,.ib,.mode,.tab,.gmeter,#goal,#wind,.bst,.linkbtn,.card,#scene{border-radius:3px;border:1px solid var(--hud);background:var(--panel);box-shadow:none;backdrop-filter:none}
.ib{border-radius:3px}
.lv{border-radius:2px;background:transparent;color:var(--cy);border:1px solid var(--cy);width:30px;height:30px;font-size:17px;box-shadow:0 0 10px rgba(111,227,255,.3)}
.xp{border-radius:0;height:3px}.xp i{border-radius:0;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.dot{border-radius:0;transform:rotate(45deg);background:#ff4d6d}
.cta,.btn.main{border-radius:0;font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#ffd84a,#f2a900);color:#1a1200;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:none}
.btn{border-radius:0;border:1px solid var(--hud);background:var(--panel);font-family:var(--disp);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.btn.vid{background:transparent;color:var(--cy);border-color:var(--cy)}
.tab{font-size:16px}.tab small{letter-spacing:.08em;text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:700;font-size:9.5px}
.tab.sel{background:var(--ch,#ffd23f);color:#06080f;border-color:transparent;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.tab.sel small{color:rgba(6,8,15,.7)}
#sceneTitle small{letter-spacing:.3em;color:var(--cy)}#sceneTitle b{font-size:30px}
#scene{box-shadow:0 0 0 1px rgba(111,227,255,.08)}
.nb{border-radius:50%;background:transparent;border:1px solid var(--hud);font-size:20px;box-shadow:inset 0 0 0 5px rgba(111,227,255,.03)}
.nb small{font-family:'DM Sans',sans-serif;font-weight:700}
.nb.done{background:radial-gradient(circle,transparent 0%,transparent 72%);background:radial-gradient(circle,color-mix(in srgb,var(--ch,#ffd23f) 30%,transparent) 0%,transparent 72%);border-color:var(--ch,#ffd23f);box-shadow:0 0 12px transparent;box-shadow:0 0 12px color-mix(in srgb,var(--ch,#ffd23f) 35%,transparent)}
.nb.next{background:var(--ch,#ffd23f);color:#06080f;box-shadow:0 0 24px 2px var(--ch,#ffd23f);box-shadow:0 0 24px 2px color-mix(in srgb,var(--ch,#ffd23f) 60%,transparent)}
.nb.boss::after{border-style:solid;border-width:1px;opacity:.4;top:-4px;right:-4px;bottom:-4px;left:-4px}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:#8ea4d8;font-weight:700}
.mode,.card{background:linear-gradient(135deg,rgba(111,227,255,.07),rgba(111,227,255,.01))}
.mode.daily{border-color:rgba(255,200,70,.5)}.mode.endless{border-color:rgba(111,227,255,.5)}
.mode b{font-size:19px}
.mode::before,.card::before,.gmeter::before{content:'';position:absolute;top:-1px;right:-1px;bottom:-1px;left:-1px;pointer-events:none;background:linear-gradient(var(--cy),var(--cy)) top left/9px 1px no-repeat,linear-gradient(var(--cy),var(--cy)) top left/1px 9px no-repeat,linear-gradient(var(--cy),var(--cy)) bottom right/9px 1px no-repeat,linear-gradient(var(--cy),var(--cy)) bottom right/1px 9px no-repeat}
.card,.gmeter{position:relative}
.card{background:linear-gradient(180deg,#0b1332,#060a1e);border-radius:3px}.card h2{font-size:34px;letter-spacing:.06em}
#board{border-radius:3px}
.gmeter b{font-size:30px}.gmeter small{letter-spacing:.2em}
.bst{border-radius:3px;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.rwd span{border-radius:2px;border:1px solid var(--hud);background:transparent}
.rstars svg.on{color:#ffd23f}

/*END-PERSONALITY*/
/*LAYOUT*/
/* Layout for average Android phones (360x640 .. 412x915): the game screen fills the viewport, the playfield takes ALL the free height and blends with an animated backdrop. */
#game.scr.on{height:100vh;height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:6px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom));padding-left:10px;padding-right:10px}
#game .hint{min-height:0;font-size:12.5px;line-height:1.3;margin:0;padding:0 4px}
#game .hint:empty{display:none}
#game .boosters{gap:6px}
#game .bst{min-height:52px;padding:4px 2px;border-radius:13px;font-size:11px;gap:2px}
#game .bst svg{width:20px;height:20px}
#game .ib{width:40px;height:40px}
#boardWrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#game::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;opacity:.9;background:var(--bgfx);animation:bgdrift 18s ease-in-out infinite alternate}
@keyframes bgdrift{from{background-position:0 0,100% 100%,50% 0}to{background-position:12% 18%,82% 78%,50% 12%}}
#game>*{position:relative;z-index:1}
@media (max-height:620px){#game .hint{display:none}#game .bst{min-height:46px}#game .bst em{display:none}}

#game.scr{position:relative}

:root{--bgfx:radial-gradient(circle at 50% 42%,rgba(40,70,200,.28),transparent 58%),radial-gradient(circle at 12% 90%,rgba(111,227,255,.12),transparent 45%),radial-gradient(circle at 90% 8%,rgba(255,190,60,.10),transparent 40%)}
#arena{width:var(--bs,300px);height:var(--bs,300px);aspect-ratio:auto;min-width:0;border:none;border-radius:0;overflow:visible;background:radial-gradient(circle at 50% 50%,rgba(40,70,220,.34) 0%,transparent 68%);box-shadow:none}
#lives{min-height:0}#goalLine{font-size:13px;min-height:0;margin:0}
.gmeter{padding:3px 10px;min-width:70px}.gmeter b{font-size:24px}

/*END-LAYOUT*/
.applogo{position:relative;width:min(34vw,148px);height:min(34vw,148px);border-radius:26%;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12);animation:logoPop 1s cubic-bezier(.2,1.5,.4,1) both,logoFloat 4s 1s ease-in-out infinite alternate;margin-bottom:10px;z-index:2}@keyframes logoPop{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}@keyframes logoFloat{to{transform:translateY(-7px)}}

/*PERF*/
/* performance: composited-only animation (transform/opacity), no full-screen blends/blur; low-end devices get a lighter mode */
#game::before{top:-14%!important;right:-14%!important;bottom:-14%!important;left:-14%!important;background-position:0 0!important;will-change:transform;animation:bgflow 22s ease-in-out infinite alternate!important}
@keyframes bgflow{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2.5%,0) scale(1.1)}}
body::before{mix-blend-mode:normal!important;opacity:.05!important}
#caus{mix-blend-mode:normal!important;opacity:.5;will-change:transform}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
html.lowfx .tile,html.lowfx .vat{transition-duration:.12s!important}

/*END-PERF*/

/*COMPAT*/
/* small / narrow phones (320-360px) and long translations: nothing may overflow or clip */
.row{flex-wrap:wrap}
.row .btn{min-width:0;flex:1 1 84px;padding-left:6px;padding-right:6px;font-size:15px}
#game .bst{min-width:0;overflow:hidden}
#game .bst span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt b{line-height:1.2;padding-top:1px}
@media (max-width:370px){#game .bst span{font-size:10px;letter-spacing:0!important}#game .bst{font-size:10px}.row .btn{font-size:14px}.card{padding-left:14px;padding-right:14px}}
.k-card{max-width:calc(100vw - 24px)}
#game #bGameSet span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#game #bGameSet svg{width:24px;height:24px}

/*END-COMPAT*/

/* ---- chapter scenes: twelve stations around the sun light up as levels are cleared ---- */
function scene(ch, lit) {
  var s = '<svg viewBox="0 0 400 150" role="img" aria-hidden="true"><defs><radialGradient id="sg' + ch + '" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".6" stop-color="#ffc43a"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient>' +
    '<radialGradient id="bg' + ch + '" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="' + CH_BG[ch][0] + '"/><stop offset="1" stop-color="' + CH_BG[ch][1] + '"/></radialGradient><filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="400" height="150" fill="url(#bg' + ch + ')"/>', i;
  for (i = 0; i < 34; i++) s += '<circle cx="' + ((i * 97) % 400) + '" cy="' + ((i * 53) % 150) + '" r="' + (i % 3 ? .7 : 1.3) + '" fill="#fff" opacity="' + (.2 + (i % 4) * .15) + '"/>';
  var rx = ch === 2 ? 168 : 150, ry = ch === 2 ? 44 : 52, cx = 200, cy = 75, sx = ch === 2 ? -34 : 0;
  s += '<ellipse cx="' + (cx + sx) + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="5"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="40" fill="#ffc43a" opacity=".35" filter="url(#gl)"/><circle cx="' + cx + '" cy="' + cy + '" r="22" fill="url(#sg' + ch + ')"/>';
  if (ch === 4) s += '<circle cx="' + cx + '" cy="' + cy + '" r="22.5" fill="#02020c"/><circle cx="' + cx + '" cy="' + cy + '" r="30" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" filter="url(#gl)"/>';
  for (i = 0; i < PER; i++) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / PER, x = cx + sx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry, on = lit[i], boss = i === PER - 1;
    if (ch === 1 && i % 3 === 1) s += '<circle cx="' + x.toFixed(1) + '" cy="' + (y + 0).toFixed(1) + '" r="9" fill="none" stroke="#ff6fb8" stroke-width="1.6" stroke-dasharray="2 2" opacity=".7"/>';
    if (on) s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="14" fill="' + CH_HUE[ch] + '" opacity=".55" filter="url(#gl)"/>';
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (boss ? 8 : 6) + '" fill="' + (on ? CH_HUE[ch] : '#0a0e33') + '" stroke="' + (on ? '#fff' : 'rgba(255,255,255,.35)') + '" stroke-width="' + (boss ? 2.4 : 1.6) + '"/>';
  }
  return s + '</svg>';
}

  K.modal({ title: tt('noCoinsTitle'), body: '<p>' + tt('noCoinsText') + '</p>', buttons: [
    { label: tt('watch'), main: true, onClick: function () { Ads.rewarded(kind).then(function (ok) { if (ok && S && !S.over) apply(); }); } },
    { label: tt('cancel') }] });
}
$('bFocus').onclick = function () { useBooster('focus', function () { S.run.focus = 4; S.run.w = S.sp.w * 1.7; K.toast('✦'); renderHud(); }); };
$('bHeart').onclick = function () { useBooster('heart', function () { S.run.lives = Math.min(MAXLIVES, S.run.lives + 1); S.maxLives = Math.max(S.maxLives, S.run.lives); K.sfx.play('levelup'); renderHud(); }); };
$('bRestart').onclick = function () { K.sfx.play('click'); begin(S.mode, S.mode === 'endless' ? E.endlessSpec(0) : S.mode === 'daily' ? S.sp : S.sp, S.idx); };
$('bGameSet').onclick = function () { K.sfx.play('click'); K.openSettings(); };
$('gBack').onclick = function () { K.sfx.play('click'); goHome(); };

/* ======================================================= results */
function openRes(html) { $('resCard').innerHTML = html; $('res').classList.add('show'); }
var _resBusy = false;
function afterRes(go) {
  if (_resBusy) return; _resBusy = true;
  $('res').classList.remove('show');
  var p = pendingEnd ? Promise.race([Promise.resolve(Ads.levelEnded()), new Promise(function (r) { setTimeout(r, 4500, false); })]) : Promise.resolve(false); pendingEnd = false;
  var run = function () { _resBusy = false; go(); }; p.then(run, run);
}
function finish(win) {
  S.over = true; S.win = win; renderHud();
  if (S.mode === 'endless') return endlessResult();
  if (!win) return failCard();
  var r = S.run, stars = E.stars(r), coins = 0, xp = 0, first = false, h = '';
  K.sfx.play('win'); K.haptic('success'); V.sunPop = .3;
  if (S.mode === 'journey') {
    var old = P.stars[S.idx]; first = old === 0;
    if (stars > old) { P.stars[S.idx] = stars; K.meta.stat('starsTotal', stars - old); }
    if (first) { K.meta.stat('wins', 1); if (S.idx % PER === PER - 1) K.meta.stat('chapters', 1); }
    coins = 8 + 4 * stars + (stars === 3 && old < 3 ? 15 : 0); xp = (first ? 25 : 8) + 10 * stars;
    if (S.idx === LEVELS.length - 1 && !P.fin) { P.fin = true; setTimeout(finale, 2200); }
  } else {
    var today = K.meta.todayKey(), firstToday = !(P.daily.key === today && P.daily.done);
    if (firstToday) { P.daily = { key: today, done: true }; K.meta.stat('dailies', 1); coins = 60; xp = 40; } else { coins = 6; xp = 6; }
  }
  saveP(); K.meta.addCoins(coins, true); K.meta.addXp(xp);
  h += '<h2>' + tt('winTitle') + '</h2><div class="rstars">' + [0, 1, 2].map(function () { return ICON.star; }).join('') + '</div><p>' + tt('winLine', { m: r.misses, p: r.perfects }) + '</p>';
  h += '<div class="rwd"><span>' + ICON.coin + '+' + coins + '</span><span>' + ICON.xp + '+' + xp + '</span></div>';
  h += '<button class="btn vid" id="rDouble"><span>' + tt('doubleCoins') + '</span><small>' + ICON.video + tt('watch') + '</small></button>';
  var hasNext = S.mode === 'journey' && S.idx < LEVELS.length - 1 && unlocked(S.idx + 1);
  h += hasNext ? '<button class="btn main" id="rNext">' + tt('next') + '</button>' : '';
  h += '<div class="row"><button class="btn" id="rRetry">' + tt('retry') + '</button><button class="btn" id="rShare">' + tt('share') + '</button><button class="btn" id="rMap">' + tt('map') + '</button></div>';
  setTimeout(function () { openRes(h); pendingEnd = true; bindWin(coins, stars); }, 650);
}
function bindWin(coins, stars) {
  var svgs = $('resCard').querySelectorAll('.rstars svg');
  for (var i = 0; i < stars; i++) (function (i) { setTimeout(function () { svgs[i].classList.add('on'); K.sfx.play('note', 3 + i * 2); }, 350 + i * 320); })(i);
  setTimeout(function () { K.fx.confetti({ n: 90 }); }, 250);
  var dbl = $('rDouble'); dbl.onclick = function () { Ads.rewarded('double').then(function (ok) { if (ok) { K.meta.addCoins(coins); dbl.hidden = true; } }); };
  if (coins <= 6) dbl.hidden = true;
  if ($('rNext')) $('rNext').onclick = function () { afterRes(function () { startJourney(S.idx + 1); }); };
  $('rRetry').onclick = function () { afterRes(function () { begin(S.mode, S.sp, S.idx); }); };
  $('rMap').onclick = function () { afterRes(function () { if (S.mode === 'journey') selCh = Math.floor(Math.min(nextLevel(), LEVELS.length - 1) / PER); goHome(); }); };
  $('rShare').onclick = function () { K.share({ text: tt('shareText', { n: S.mode === 'journey' ? S.idx + 1 : '★' }) }); };
  if (S.mode === 'journey') selCh = Math.floor(nextLevel() / PER);
  K.meta.maybeAskReview();
}
function failCard() {
  K.sfx.play('fail'); K.haptic('error');
  var h = '<h2>' + tt('failTitle') + '</h2><p>' + tt('failText') + '</p>';
  if (!S.rescued) h += '<button class="btn vid" id="rAd"><span>' + tt('adHeart') + '</span><small>' + ICON.video + tt('watch') + '</small></button>';
  h += '<button class="btn main" id="rRetry">' + tt('retry') + '</button><button class="btn" id="rMap">' + tt('map') + '</button>';
  setTimeout(function () {
    openRes(h); pendingEnd = true;
    if ($('rAd')) $('rAd').onclick = function () { Ads.rewarded('rescue').then(function (ok) { if (!ok) return; S.rescued = true; S.run.over = false; S.run.lives = 1; S.over = false; S.state = 'play'; S.delay = 1; S.run.since = 0; E.place(S.run); $('res').classList.remove('show'); pendingEnd = false; renderHud(); }); };
    $('rRetry').onclick = function () { afterRes(function () { begin(S.mode, S.sp, S.idx); }); };
    $('rMap').onclick = function () { afterRes(function () { goHome(); }); };
  }, 650);
}
function endlessResult() {
  var r = S.run, sc = r.score, best = sc > P.endlessBest, xp = Math.floor(sc / 8) + 5;
  if (best) P.endlessBest = sc; saveP();
  K.meta.stat('endlessBest', sc, { max: true }); K.meta.addXp(xp); K.meta.addCoins(Math.floor(sc / 20), true);
  if (PG) PG.submitScore('endless', sc);
  K.sfx.play(best ? 'win' : 'fail'); if (best) setTimeout(function () { K.fx.confetti({ n: 80 }); }, 700);
  var h = '<h2>' + (best ? tt('newBest') : tt('gameOver')) + '</h2><div class="rwd"><span style="font-size:22px">' + K.fmt(sc) + '</span></div><p>' + tt('bestScore') + ': ' + K.fmt(P.endlessBest) + ' · ' + tt('streakLbl') + ' ' + r.best + '</p>';
  h += '<div class="rwd"><span>' + ICON.xp + '+' + xp + '</span></div>';
  if (!S.rescued) h += '<button class="btn vid" id="rAd"><span>' + tt('revive') + '</span><small>' + ICON.video + tt('watch') + '</small></button>';
  h += '<button class="btn main" id="rRetry">' + tt('retry') + '</button><div class="row"><button class="btn" id="rShare">' + tt('share') + '</button><button class="btn" id="rMap">' + tt('map') + '</button></div>';
  setTimeout(function () {
    openRes(h); pendingEnd = true;
    if ($('rAd')) $('rAd').onclick = function () { Ads.rewarded('revive').then(function (ok) { if (!ok) return; S.rescued = true; S.run.over = false; S.run.lives = 2; S.over = false; S.state = 'play'; S.delay = 1; S.run.since = 0; E.place(S.run); $('res').classList.remove('show'); pendingEnd = false; renderHud(); }); };
    $('rRetry').onclick = function () { afterRes(function () { startEndless(); }); };
    $('rMap').onclick = function () { afterRes(function () { goHome(); }); };
    $('rShare').onclick = function () { K.share({ text: tt('shareScore', { n: K.fmt(sc) }) }); };
  }, 650);
}
function finale() { K.fx.confetti({ n: 160 }); K.sfx.play('levelup'); K.modal({ title: tt('finaleTitle'), body: '<p>' + tt('finaleText') + '</p>', buttons: [{ label: tt('gotIt'), main: true }] }); }


/* ======================================================= tutorial */
function orbitArt(mode) {
  var arcCol = '#ffd23f', a = '<svg viewBox="0 0 170 170" width="170" height="170"><defs><radialGradient id="tsn" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff7c8"/><stop offset=".6" stop-color="#ffc43a"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient></defs>';
  a += '<circle cx="85" cy="85" r="60" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/><circle cx="85" cy="85" r="22" fill="url(#tsn)"><animate attributeName="r" values="22;23.5;22" dur="2s" repeatCount="indefinite"/></circle>';
  var arc = function (cx, col, w, dash) { var r = 60, a0 = (cx - w / 2) * Math.PI / 180, a1 = (cx + w / 2) * Math.PI / 180; return '<path d="M' + (85 + r * Math.cos(a0)).toFixed(1) + ' ' + (85 + r * Math.sin(a0)).toFixed(1) + ' A' + r + ' ' + r + ' 0 0 1 ' + (85 + r * Math.cos(a1)).toFixed(1) + ' ' + (85 + r * Math.sin(a1)).toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="9" stroke-linecap="round"' + (dash ? ' stroke-dasharray="5 5"' : '') + '/>'; };
  if (mode === 'decoy') a += arc(-30, '#ff2f86', 34, true) + arc(-120, arcCol, 34);
  else a += arc(-90, arcCol, 40) + (mode === 'perfect' ? arc(-90, '#fff', 9) : '');
  var moon = '<circle cx="85" cy="25" r="10" fill="#04061c" stroke="#fff" stroke-width="2"/>';
  if (mode === 'spin' || mode === 'decoy') a += '<g>' + moon + '<animateTransform attributeName="transform" type="rotate" from="0 85 85" to="360 85 85" dur="4.5s" repeatCount="indefinite"/></g>';
  else a += '<g>' + moon + '<animateTransform attributeName="transform" type="rotate" values="-75 85 85;0 85 85;0 85 85;75 85 85" keyTimes="0;.5;.62;1" dur="2.6s" repeatCount="indefinite"/></g>';
  if (mode === 'tap') a += '<text x="85" y="148" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.5;.62;.7;1" dur="2.6s" repeatCount="indefinite"/>' + tt('tapHere') + '</text>';
  if (mode === 'perfect') { for (var i = 0; i < 3; i++) a += '<g transform="translate(' + (55 + i * 30) + ' 140)"><circle r="7" fill="#ffd23f" opacity="' + (i === 2 ? .3 : 1) + '"/></g>'; }
  return a + '</svg>';
}
K.cfg.tutorial = function () {
  return [
    { art: orbitArt('spin'), title: tt('tutT1'), text: tt('tutX1') },
    { art: orbitArt('tap'), title: tt('tutT2'), text: tt('tutX2') },
    { art: orbitArt('perfect'), title: tt('tutT3'), text: tt('tutX3') },
    { art: orbitArt('decoy'), title: tt('tutT4'), text: tt('tutX4') }
  ];
};

K.i18n.onChange(function () { applyI18n(); if ($('home').classList.contains('on')) renderHome(); else if ($('game').classList.contains('on') && S) { renderHud(); $('gLab').textContent = S.mode === 'endless' ? tt('score') : tt('hits'); $('gTitle').textContent = S.mode === 'journey' ? tt('level', { n: S.idx + 1 }) : S.mode === 'endless' ? tt('endless') : tt('dailyEclipse'); $('gSub').textContent = S.mode === 'journey' ? tt('ch' + (S.sp.ch + 1)) : ''; } });
applyI18n();
try {

} catch (e) {}
requestAnimationFrame(frame);
window.__eclipse = { get S() { return S; }, P: P, E: E, onTap: onTap, finish: finish, startJourney: startJourney, startEndless: startEndless, startDaily: startDaily, goHome: goHome };

<script>
/* board sizing without container queries (old Android WebViews): measure the free box and set --bs / --bw */
(function(){var w=document.getElementById('boardWrap'); if(!w) return; var last='';
function fit(){var W=w.clientWidth,H=w.clientHeight; if(!W||!H) return; var bs=Math.floor(Math.min(W,H)),bw=Math.floor(Math.min(W,H*7/8)),k=bs+'/'+bw; if(k===last) return; last=k;
 var r=document.documentElement.style; r.setProperty('--bs',bs+'px'); r.setProperty('--bw',bw+'px'); try{window.dispatchEvent(new Event('resize'))}catch(e){}}
window.addEventListener('resize',fit); window.addEventListener('orientationchange',fit);
try{new ResizeObserver(fit).observe(w)}catch(e){} setInterval(fit,700); fit();})();
</script>
